; PlatformIO Project Configuration
;
; IMPORTANTE: voce precisa configurar o TFT_eSPI para o seu hardware.
; A forma recomendada e via build_flags abaixo (sem editar User_Setup.h
; dentro da biblioteca). Ajuste os pinos conforme sua placa.

; Base comum: TFT_eSPI + pinagem + frequencias. Os envs especificos abaixo
; herdam isso e divergem apenas no lib_deps, build_src_filter e build_flags
; extras (ex.: NimBLE so no env de producao).
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- Base: pinos, frequencias e fontes (sem driver) ----
; O driver e adicionado por cada env separadamente.
tft_base =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; ---- Pinos do TFT (ajuste pra sua placa!) ----
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    ; ---- Backlight ----
    ; Display 5V (regulador onboard): pino LED vai DIRETO em VIN/5V.
    ; Nao gerenciamos backlight via GPIO. Se um dia migrar para placa 3V3
    ; com LED chaveado, redefina TFT_BL / TFT_BACKLIGHT_ON aqui.

    ; ---- Frequencia SPI ----
    ; 10 MHz: conservador, descarta integridade de sinal em jumpers longos
    ; durante bring-up. Subir para 40 MHz so depois que o display estiver
    ; funcionando estavel.
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=10000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; ---- Fontes ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1

    ; Nota: TFT_eSPI emite "#warning TOUCH_CS pin not defined" porque ela
    ; tem suporte de touch proprio (tft.getTouch/calibrateTouch). Nao usamos
    ; - quem fala com o XPT2046 e a lib XPT2046_Touchscreen. Warning esperado.

; Lib so do TFT (Stage 2). Stage 3+ acrescenta o XPT2046.
tft_only_lib_deps =
    bodmer/TFT_eSPI@^2.5.43

tft_lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ---- Env principal: firmware ClipSync (TFT + touch + BLE), driver ILI9341 ----
[env:esp32dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps =
    ${common.tft_lib_deps}
    ; NimBLE 2.x: compativel com arduino-esp32 3.x / ESP-IDF v5.x.
    ; A 1.4.x da crash loop com ESP_ERR_INVALID_STATE em esp_bt_controller_init
    ; sob o platform atual (espressif32 55.x).
    h2zero/NimBLE-Arduino@^2.0.0

build_src_filter = +<*> -<display_test.cpp> -<test_02_tft.cpp> -<test_03_touch.cpp>

build_flags =
    ${common.tft_base}
    -DILI9341_DRIVER=1
    ; ---- NimBLE: aumenta max conexoes para 3 (PC + celular + 1 spare) ----
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3

; ---- Env de bancada (ILI9341): so display + touch, sem BLE ----
;   pio run -e display_test -t upload && pio device monitor -e display_test
[env:display_test]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.tft_lib_deps}
build_src_filter = -<*> +<display_test.cpp>
; (test_02_tft.cpp e test_03_touch.cpp ficam fora por causa do -<*>)

build_flags =
    ${common.tft_base}
    -DILI9341_DRIVER=1

; ---- Env de bancada (ST7789): mesmo sketch, driver diferente ----
; Use quando a tela ficar branca/preta com o env display_test - alguns
; modulos 2.4/2.8" vermelhos vem com ST7789 mesmo serigrafados como "TFT".
;   pio run -e display_test_st7789 -t upload && pio device monitor -e display_test_st7789
[env:display_test_st7789]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.tft_lib_deps}
build_src_filter = -<*> +<display_test.cpp>
; (test_02_tft.cpp e test_03_touch.cpp ficam fora por causa do -<*>)

build_flags =
    ${common.tft_base}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR

; ============================================================================
; STAGES de bring-up incremental
; ============================================================================
; Stage 1 -> sem firmware: so backlight. Conecta VCC/GND/LED em VIN.
; Stage 2 -> test_02_tft: TFT puro, sem touch. Sem lib XPT2046.
; Stage 3 -> test_03_touch: touch + feedback no TFT (proximo).
; Stage 4 -> display_test: tudo junto + calibracao (ja existe).
;
; Cada env Stage exclui o arquivo dos outros Stages para evitar duplicacao
; de setup()/loop() no link.

; ---- Stage 2: TFT only (ILI9341 + sem touch) ----
;   pio run -e test_02_tft -t upload && pio device monitor -e test_02_tft
[env:test_02_tft]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.tft_only_lib_deps}
build_src_filter = -<*> +<test_02_tft.cpp>

build_flags =
    ${common.tft_base}
    -DILI9341_DRIVER=1

; ---- Stage 2 alternativo: ST7789 ----
;   pio run -e test_02_tft_st7789 -t upload
[env:test_02_tft_st7789]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.tft_only_lib_deps}
build_src_filter = -<*> +<test_02_tft.cpp>

build_flags =
    ${common.tft_base}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR

; ---- Stage 3: touch + feedback no TFT (ILI9341) ----
;   pio run -e test_03_touch -t upload && pio device monitor -e test_03_touch
[env:test_03_touch]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.tft_lib_deps}
build_src_filter = -<*> +<test_03_touch.cpp>

build_flags =
    ${common.tft_base}
    -DILI9341_DRIVER=1
